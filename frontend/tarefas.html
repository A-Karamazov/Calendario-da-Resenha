<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário da Resenha — Tarefas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <header class="app-header">
    <div class="app-header__top">
      <span class="app-header__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <line x1="3" y1="10" x2="21" y2="10"/> <line x1="8" y1="3" x2="8" y2="7"/> <line x1="16" y1="3" x2="16" y2="7"/>
        </svg>
      </span>
      <p class="app-header__title">Calendário da Resenha</p>
    </div>

    <nav class="tabs">
      <a class="tab is-active" href="index.html">Tarefas</a>
      <a class="tab" href="nova-tarefa.html">Nova Tarefa</a>
      <a class="tab" href="adm-login.html">ADM</a>
    </nav>
  </header>

  <div class="admin-bar" id="admin-bar"></div>

  <section class="hero">
    <div>
      <h1>Todos os trabalhos e provas da IA25 aqui</h1>
      <p>Veja o que tem pra fazer essa semana ou na próxima</p>
    </div>

    <div class="hero__badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#114B5F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <line x1="3" y1="10" x2="21" y2="10"/> <line x1="8" y1="3" x2="8" y2="7"/> <line x1="16" y1="3" x2="16" y2="7"/>
      </svg>
      <span class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="5,12 10,17 20,7"/>
        </svg>
      </span>
    </div>
    
  </section>

  <section class="list-section">
    <div class="list-section__head">
      <h2>Próximas tarefas</h2>
      <label class="sort">
        Ordenar por:
        <select id="sort-select">
          <option value="proximas">Mais próximas</option>
          <option value="distantes">Mais distantes</option>
          <option value="materia">Matéria (A–Z)</option>
        </select>
      </label>
    </div>

    <div class="task-list" id="task-list">
      <p class="task-list__status">Carregando tarefas...</p>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.9/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script type="module" src="tarefas.js"></script>

</body>
</html>
