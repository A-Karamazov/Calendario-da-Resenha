<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário da Resenha — Acesso Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <header class="app-header">
    <div class="app-header__top">
      <span class="app-header__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <line x1="8" y1="3" x2="8" y2="7"/>
          <line x1="16" y1="3" x2="16" y2="7"/>
        </svg>
      </span>
      <p class="app-header__title">Calendário da Resenha</p>
    </div>
    <nav class="tabs">
      <a class="tab" href="tarefas.html">Tarefas</a>
      <a class="tab" href="nova-tarefa.html">Nova Tarefa</a>
      <a class="tab is-active" href="adm-login.html">ADM</a>
    </nav>
  </header>

  <section class="form-section">
    <h1>Acesso administrativo</h1>
    <p>Entre com a conta de admin para poder remover tarefas.</p>

    <form id="admin-login-form">
      <div class="field">
        <label for="email">E-mail <span class="req">*</span></label>
        <input type="email" id="email" placeholder="admin@exemplo.com" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="senha">Senha <span class="req">*</span></label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <p id="login-feedback" class="form-feedback" role="status"></p>

      <div class="form-actions">
        <a class="btn btn--ghost" href="tarefas.html">Voltar</a>
        <button type="submit" class="btn btn--primary">Entrar</button>
      </div>
    </form>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.9/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script type="module" src="admin-login.js"></script>

</body>
</html>
